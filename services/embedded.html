<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>($WEBSITE_TITLE)</title>
    <style>
        :root {
            --surface: #272424;
            --bg:      #1b1b1c;
            --text:    #b7b7b7;
            --bright:  #ffffff;
            --green:   #008060;
            --red:     #d82c0d;
            --red-bg:  #2a1515;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #store-frame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 10;
            pointer-events: none;
        }
        #store-frame.visible {
            opacity: 1;
            pointer-events: all;
        }

        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        /* Spinner */
        #loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.1rem;
        }
        .ring { width: 44px; height: 44px; }
        .ring svg { width: 100%; height: 100%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .ring-track { fill: none; stroke: rgba(0,128,96,0.15); stroke-width: 4; }
        .ring-fill  { fill: none; stroke: var(--green); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 68 100; }
        .loader-label { font-size: 0.78rem; color: var(--text); letter-spacing: 0.05em; }

        /* Down card */
        #down-card {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 0.9rem;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 10px;
            padding: 2rem 1.75rem;
            max-width: 340px;
            width: calc(100% - 2.5rem);
            text-align: center;
        }
        .down-logo { height: 30px; width: auto; opacity: 0.8; }
        .down-icon {
            width: 48px; height: 48px; border-radius: 50%;
            background: var(--red-bg);
            border: 1px solid rgba(216,44,13,0.25);
            display: flex; align-items: center; justify-content: center;
        }
        .down-icon svg {
            width: 22px; height: 22px;
            stroke: var(--red); fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .down-title { font-size: 1rem; font-weight: 600; color: var(--bright); }
        .down-body  { font-size: 0.8rem; color: var(--text); line-height: 1.6; }
        .divider    { width: 100%; height: 1px; background: rgba(255,255,255,0.06); }
        .retry-btn {
            width: 100%; padding: 0.58rem 1rem;
            background: var(--green); color: #fff;
            border: none; border-radius: 5px;
            font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: opacity 0.15s; margin-top: 0.15rem;
        }
        .retry-btn:hover { opacity: 0.85; }
    </style>
</head>
<body>

<iframe
    id="store-frame"
    sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-downloads"
    allow="payment; camera; microphone; geolocation"
></iframe>

<div id="overlay">
    <div id="loader">
        <div class="ring">
            <svg viewBox="0 0 44 44">
                <circle class="ring-track" cx="22" cy="22" r="18"/>
                <circle class="ring-fill"  cx="22" cy="22" r="18"/>
            </svg>
        </div>
        <span class="loader-label">Loading…</span>
    </div>

    <div id="down-card">
        <img src="/assets/favicon.png" class="down-logo" alt="" onerror="this.style.display='none'">
        <div class="down-icon">
            <svg viewBox="0 0 24 24">
                <line x1="1" y1="1" x2="23" y2="23"/>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/>
            </svg>
        </div>
        <p class="down-title">Store is currently down</p>
        <p class="down-body">
            We can't reach the store right now.<br>
            It may be restarting or temporarily offline.<br>
            Please check back in a few minutes.
        </p>
        <div class="divider"></div>
        <button class="retry-btn" onclick="init()">Try Again</button>
    </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
//
//  BASE_URL  — the full URL to your store root on the SaaS platform.
//              Must end WITHOUT a trailing slash.
//              Example: "https://saas.e/store1"
//
//  When a link inside the store fires ?page=about, the iframe navigates to:
//              BASE_URL + "/?page=about"   →  https://saas.e/store1/?page=about
//
//  Simultaneously, the proxy page (this file) updates its own URL to:
//              proxy.html?page=about       (or  /  on a web server → /?page=about)
//
// ─────────────────────────────────────────────────────────────────────────────
const BASE_URL   = "($WEBSITE_LINK)".replace(/\/$/, '');  // e.g. "https://saas.e/store1"
const TIMEOUT_MS = 10_000;
// ─────────────────────────────────────────────────────────────────────────────

const frame    = document.getElementById('store-frame');
const loader   = document.getElementById('loader');
const downCard = document.getElementById('down-card');

let timeoutHandle = null;
let pollHandle    = null;
let lastIframeQS  = null;   // last seen query string inside the iframe

// ─── Helpers ──────────────────────────────────────────────────────────────────

/**
 * The iframe always loads:  BASE_URL/ + whatever query string is on THIS page.
 *
 * Proxy page URL:               Iframe loads:
 *   proxy.html                    https://saas.e/store1/
 *   proxy.html?page=about         https://saas.e/store1/?page=about
 *   proxy.html?page=shop&id=5     https://saas.e/store1/?page=shop&id=5
 *   /?page=about  (web server)    https://saas.e/store1/?page=about
 */
function buildIframeSrc() {
    const qs = window.location.search;   // e.g. "?page=about" or ""
    return BASE_URL + '/' + qs;
}

/**
 * Extract just the query string from the iframe's current URL.
 * Returns "" when on the root / no params.
 */
function iframeQueryString() {
    try {
        const href = frame.contentWindow.location.href;
        if (!href || href === 'about:blank') return null;
        return new URL(href).search;   // e.g. "?page=about"
    } catch {
        // Cross-origin — can't read; rely on postMessage
        return null;
    }
}

/**
 * Update this proxy page's own URL to match what the iframe is showing,
 * WITHOUT triggering a page reload.
 *
 * iframe shows: https://saas.e/store1/?page=about
 * proxy becomes: proxy.html?page=about  (or  /?page=about  on a web server)
 */
function syncProxyURL(iframeQS) {
    // Build the new proxy URL: keep everything except the query string
    const current = window.location;
    const newURL  = current.pathname + (iframeQS || '');
    if (current.pathname + current.search !== newURL) {
        history.pushState(null, '', newURL);
    }
}

// ─── UI ───────────────────────────────────────────────────────────────────────

function showLoader() {
    loader.style.display   = 'flex';
    downCard.style.display = 'none';
}

function showDown() {
    clearTimeout(timeoutHandle);
    clearInterval(pollHandle);
    loader.style.display   = 'none';
    downCard.style.display = 'flex';
    frame.classList.remove('visible');
}

function showFrame() {
    clearTimeout(timeoutHandle);
    loader.style.display = 'none';
    frame.classList.add('visible');
    startNavPoll();
}

// ─── Navigation sync ──────────────────────────────────────────────────────────

/**
 * Poll the iframe's location every 250 ms.
 * Same-origin: we can read contentWindow.location.href directly.
 * Cross-origin: the poll silently fails and we rely on postMessage (see below).
 */
function startNavPoll() {
    clearInterval(pollHandle);
    pollHandle = setInterval(() => {
        const qs = iframeQueryString();
        if (qs === null) return;                     // cross-origin, skip
        if (qs === lastIframeQS) return;             // no change
        lastIframeQS = qs;
        syncProxyURL(qs);
    }, 250);
}

/**
 * postMessage bridge — for cross-origin iframes.
 *
 * The store page (running inside the iframe at BASE_URL) can post:
 *   window.parent.postMessage({ type: 'vm:navigate', search: '?page=about' }, '*');
 *
 * This proxy will then update its own URL to match.
 */
window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.type !== 'vm:navigate') return;
    if (typeof d.search !== 'string') return;

    // Optionally validate origin (uncomment if you know BASE_URL's origin):
    // const storeOrigin = new URL(BASE_URL).origin;
    // if (e.origin !== storeOrigin) return;

    if (d.search !== lastIframeQS) {
        lastIframeQS = d.search;
        syncProxyURL(d.search);
        // Also tell the iframe to navigate to the new URL
        // (in case the message came from a helper script, not an actual navigation)
    }
});

/**
 * Browser back/forward — resync the iframe to what the proxy URL now says.
 */
window.addEventListener('popstate', () => {
    clearInterval(pollHandle);
    lastIframeQS = null;
    frame.src = buildIframeSrc();
});

// ─── Boot ─────────────────────────────────────────────────────────────────────

async function init() {
    clearInterval(pollHandle);
    clearTimeout(timeoutHandle);
    frame.classList.remove('visible');
    lastIframeQS = null;
    showLoader();

    try {
        await fetch(BASE_URL, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' });
    } catch {
        showDown();
        return;
    }

    frame.src = buildIframeSrc();

    timeoutHandle = setTimeout(() => {
        if (!frame.classList.contains('visible')) showDown();
    }, TIMEOUT_MS);

    frame.onload = () => {
        try { if (frame.contentWindow.location.href === 'about:blank') return; } catch {}
        showFrame();
    };

    frame.onerror = () => showDown();
}

init();
</script>
</body>
</html>
